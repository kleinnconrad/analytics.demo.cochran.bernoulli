resources:
  jobs:
    cochran_sample_size:
      name: cochran_sample_size_calculation
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: table
          default: ${var.table}
        - name: error
          default: ${var.error}
        - name: proportion
          default: ${var.proportion}
        - name: confidence
          default: ${var.confidence}
      tasks:
        - task_key: compute_sample_size
          notebook_task:
            notebook_path: ../src/cochran.py

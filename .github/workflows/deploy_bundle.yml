name: Deploy Databricks Bundle

on:
  push:
    branches:
      - main  # Change this if your default branch is 'master'
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'resources/**/*.yml'
      - 'databricks.yml'

jobs:
  deploy:
    name: Validate and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Test Environment Setup ---
      # 1. Set up Java (Upgraded to 17 for modern Ubuntu runner compatibility)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # 2. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      # 3. Install testing dependencies
      - name: Install dependencies
        run: uv sync

      # 4. Run Unit Tests (With robust PySpark environment variables)
      - name: Run unit tests
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          SPARK_LOCAL_IP: "127.0.0.1"
          PYSPARK_PYTHON: "python3"
          PYSPARK_DRIVER_PYTHON: "python3"
          # This arg prevents Spark from trying to open the Web UI on the runner
          PYSPARK_SUBMIT_ARGS: "--conf spark.ui.enabled=false pyspark-shell"
        run: uv run pytest tests/
      # ------------------------------

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate

      - name: Deploy Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy
        

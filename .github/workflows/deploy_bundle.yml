name: Test and Deploy Databricks Bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'resources/**/*.yml'
      - 'databricks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'resources/**/*.yml'
      - 'databricks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'
  # Manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Spark integration tests start a local Spark session, which needs Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails the job if uv.lock does not match pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  deploy:
    name: Validate and Deploy
    needs: test
    # Pull requests only run the tests; manual runs deploy only from main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deployment at a time; a newer push waits instead of cancelling a running deployment
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      # The workspace host is taken from databricks.yml
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to a commit; the action's VERSION file also pins the CLI version
      - name: Install Databricks CLI
        uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7 # v1.20.0

      - name: Validate Bundle
        run: databricks bundle validate

      - name: Deploy Bundle
        run: databricks bundle deploy

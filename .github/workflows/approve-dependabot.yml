name: Auto Approve Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Check the PR author, not github.actor: the actor is whoever triggered the event,
    # which can be Dependabot on a pull request that someone else opened.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Auto Approve
        uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Auto-approved automated PR"
